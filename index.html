<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Static copies of the studio name for link previews (they do not run JS).
       Everything on the page itself comes from config.js. -->
  <title>davidmaytry</title>
  <meta name="description" content="davidmaytry is a small indie studio making cozy multiplayer games. Our first game is Flurry Fray, a 2v2 snowball fight.">
  <meta name="theme-color" content="#121110">
  <link rel="canonical" href="https://davidmaytry.com/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="davidmaytry">
  <meta property="og:title" content="davidmaytry">
  <meta property="og:description" content="Small indie studio making cozy multiplayer games.">
  <meta property="og:url" content="https://davidmaytry.com/">
  <meta property="og:image" content="https://davidmaytry.com/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="davidmaytry">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="davidmaytry">
  <meta name="twitter:description" content="Small indie studio making cozy multiplayer games.">
  <meta name="twitter:image" content="https://davidmaytry.com/assets/og-image.png">

  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top wrap">
    <a class="brand" href="#top" aria-label="Home">
      <img src="assets/mark.svg" alt="" width="28" height="28">
      <span data-site="name">davidmaytry</span>
    </a>
    <nav>
      <a href="#games">Games</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero wrap">
      <h1 data-site="name">davidmaytry</h1>
      <p class="tagline" data-site="tagline"></p>
    </section>

    <section id="games" class="wrap section">
      <h2>Games</h2>
      <div class="games" id="games-grid"></div>
    </section>

    <section id="contact" class="wrap section">
      <h2>Contact</h2>
      <a class="email" data-site="email" href="#"></a>
      <p class="muted" data-site="contactLine"></p>
    </section>
  </main>

  <footer class="wrap foot">
    <span>&copy; <span id="year">2026</span> <span data-site="name">davidmaytry</span></span>
  </footer>

  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
